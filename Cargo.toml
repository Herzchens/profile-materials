[package]
name = "profile-service"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
publish = false

[dependencies]
arc-swap = "1.9.2"
axum = "0.8.9"
futures-util = "0.3.31"
rustls = { version = "0.23.32", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["fs", "macros", "net", "rt-multi-thread", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
twilight-gateway = { version = "0.17.1", default-features = false, features = ["rustls-platform-verifier"] }
twilight-model = "0.17.1"
